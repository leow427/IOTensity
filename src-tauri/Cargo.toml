[package]
name = "iotensity"
version = "0.1.0"
description = "A desktop instrument for virtual light and atmosphere"
authors = ["IOTensity"]
edition = "2021"

[lib]
name = "iotensity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
